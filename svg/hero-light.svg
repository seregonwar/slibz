<svg xmlns="http://www.w3.org/2000/svg" width="840" height="464" viewBox="0 0 840 464" role="img" aria-labelledby="title desc">
<title id="title">slz benchmarks</title>
<desc id="desc">DEFLATE decode (higher is better): slz 969 MB/s, libdeflate 1103 MB/s, zlib-ng 796 MB/s, zlib 462 MB/s; LZMA2 decode (higher is better): slz 151 MB/s, xz 155 MB/s; list 500k zip entries (lower is better): slz 97 ms, unzip 791 ms, Python 1945 ms, bsdtar 2800 ms, 7-Zip 4067 ms; extract silesia.zip (lower is better): slz 0.10 s, slz -j 1 0.26 s, bsdtar 0.34 s, Python 0.68 s, 7-Zip 0.82 s, unzip 1.15 s; extract silesia.tar.gz (lower is better): slz 0.27 s, bsdtar 0.38 s, pigz | tar 0.42 s, GNU tar 1.09 s; extract silesia-nonsolid.7z (lower is better): slz 0.67 s, slz -j 1 1.57 s, 7-Zip 1.56 s, bsdtar 1.56 s; extract silesia.7z (solid) (lower is better): slz 1.02 s, slz -j 1 1.50 s, 7-Zip 1.04 s, bsdtar 1.52 s. Measured 2026-11-13 by .github/workflows/bench.yml at slz 9450737 on GitHub Actions (Ubuntu 24.04.5 LTS, image 20261111.370.1; AMD EPYC 9V74, 4 threads). Archives: whole-process wall time, best of 3 runs, warm page cache; slz runs 4 threads, slz -j 1 one. Decoders: in memory over the Silesia corpus (212 MB), best of several runs. Versions: zlib 1.4, zlib-ng 2.3.3, libdeflate 1.26, xz 5.8.4, 7-Zip 26.06, bsdtar 3.8.11, unzip 6.00, GNU tar 1.35, pigz 2.8, Python 3.12.3.</desc>
