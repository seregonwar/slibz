<svg xmlns="http://www.w3.org/2000/svg" width="840" height="464" viewBox="0 0 840 464" role="img" aria-labelledby="title desc">
<title id="title">slz benchmarks</title>
<desc id="desc">DEFLATE decode (higher is better): slz 1040 MB/s, libdeflate 1165 MB/s, zlib-ng 908 MB/s, zlib 500 MB/s; LZMA2 decode (higher is better): slz 128 MB/s, xz 158 MB/s; list 500k zip entries (lower is better): slz 74 ms, unzip 470 ms, Python 1793 ms, bsdtar 2415 ms, 7-Zip 3695 ms; extract silesia.zip (lower is better): slz 0.83 s, slz -j 1 0.79 s, bsdtar 0.31 s, Python 0.62 s, 7-Zip 0.74 s, unzip 1.10 s; extract silesia.tar.gz (lower is better): slz 0.27 s, bsdtar 0.35 s, pigz | tar 0.37 s, GNU tar 0.97 s; extract silesia-nonsolid.7z (lower is better): slz 0.79 s, slz -j 1 1.91 s, 7-Zip 1.56 s, bsdtar 1.65 s; extract silesia.7z (solid) (lower is better): slz 1.80 s, slz -j 1 1.81 s, 7-Zip 1.03 s, bsdtar 1.64 s. Measured 2026-11-13 by .github/workflows/bench.yml at slz 0464858 on GitHub Actions (Ubuntu 24.04.5 LTS, image 20261101.360.1; AMD EPYC 9V45, 4 threads). Archives: whole-process wall time, best of 3 runs, warm page cache; slz runs 4 threads, slz -j 1 one. Decoders: in memory over the Silesia corpus (212 MB), best of several runs. Versions: zlib 1.4, zlib-ng 2.3.3, libdeflate 1.26, xz 5.8.4, 7-Zip 26.06, bsdtar 3.8.11, unzip 6.00, GNU tar 1.35, pigz 2.8, Python 3.12.3.</desc>
