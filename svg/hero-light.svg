<svg xmlns="http://www.w3.org/2000/svg" width="840" height="464" viewBox="0 0 840 464" role="img" aria-labelledby="title desc">
<title id="title">slz benchmarks</title>
<desc id="desc">DEFLATE decode (higher is better): slz 960 MB/s, libdeflate 1102 MB/s, zlib-ng 796 MB/s, zlib 462 MB/s; LZMA2 decode (higher is better): slz 146 MB/s, xz 152 MB/s; list 500k zip entries (lower is better): slz 96 ms, unzip 860 ms, Python 2030 ms, bsdtar 2803 ms, 7-Zip 4039 ms; extract silesia.zip (lower is better): slz 0.10 s, slz -j 1 0.27 s, bsdtar 0.35 s, Python 0.69 s, 7-Zip 0.82 s, unzip 1.15 s; extract silesia.tar.gz (lower is better): slz 0.27 s, bsdtar 0.38 s, pigz | tar 0.42 s, GNU tar 1.08 s; extract silesia-nonsolid.7z (lower is better): slz 0.75 s, slz -j 1 1.71 s, 7-Zip 1.62 s, bsdtar 1.64 s; extract silesia.7z (solid) (lower is better): slz 1.11 s, slz -j 1 1.67 s, 7-Zip 1.10 s, bsdtar 1.64 s. Measured 2026-11-13 by .github/workflows/bench.yml at slz 8cd2f55 on GitHub Actions (Ubuntu 24.04.5 LTS, image 20261101.360.1; AMD EPYC 9V74, 4 threads). Archives: whole-process wall time, best of 3 runs, warm page cache; slz runs 4 threads, slz -j 1 one. Decoders: in memory over the Silesia corpus (212 MB), best of several runs. Versions: zlib 1.4, zlib-ng 2.3.3, libdeflate 1.26, xz 5.8.4, 7-Zip 26.06, bsdtar 3.8.11, unzip 6.00, GNU tar 1.35, pigz 2.8, Python 3.12.3.</desc>
