<svg xmlns="http://www.w3.org/2000/svg" width="840" height="464" viewBox="0 0 840 464" role="img" aria-labelledby="title desc">
<title id="title">slz benchmarks</title>
<desc id="desc">DEFLATE decode (higher is better): slz 811 MB/s, libdeflate 927 MB/s, zlib-ng 702 MB/s, zlib 398 MB/s; LZMA2 decode (higher is better): slz 125 MB/s, xz 130 MB/s; list 500k zip entries (lower is better): slz 117 ms, unzip 664 ms, Python 2273 ms, bsdtar 3100 ms, 7-Zip 4662 ms; extract silesia.zip (lower is better): slz 0.12 s, slz -j 1 0.32 s, bsdtar 0.40 s, Python 0.82 s, 7-Zip 0.98 s, unzip 1.33 s; extract silesia.tar.gz (lower is better): slz 0.32 s, bsdtar 0.43 s, pigz | tar 0.58 s, GNU tar 1.24 s; extract silesia-nonsolid.7z (lower is better): slz 0.82 s, slz -j 1 1.88 s, 7-Zip 1.79 s, bsdtar 1.83 s; extract silesia.7z (solid) (lower is better): slz 1.22 s, slz -j 1 1.79 s, 7-Zip 1.21 s, bsdtar 1.82 s. Measured 2026-11-13 by .github/workflows/bench.yml at slz 9450737 on GitHub Actions (Ubuntu 24.04.5 LTS, image 20261111.370.1; AMD EPYC 7763, 4 threads). Archives: whole-process wall time, best of 3 runs, warm page cache; slz runs 4 threads, slz -j 1 one. Decoders: in memory over the Silesia corpus (212 MB), best of several runs. Versions: zlib 1.4, zlib-ng 2.3.3, libdeflate 1.26, xz 5.8.4, 7-Zip 26.06, bsdtar 3.8.11, unzip 6.00, GNU tar 1.35, pigz 2.8, Python 3.12.3.</desc>
