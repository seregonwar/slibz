<svg xmlns="http://www.w3.org/2000/svg" width="840" height="464" viewBox="0 0 840 464" role="img" aria-labelledby="title desc">
<title id="title">slz benchmarks</title>
<desc id="desc">DEFLATE decode (higher is better): slz 1024 MB/s, libdeflate 1155 MB/s, zlib-ng 906 MB/s, zlib 502 MB/s; LZMA2 decode (higher is better): slz 152 MB/s, xz 151 MB/s; list 500k zip entries (lower is better): slz 76 ms, unzip 451 ms, Python 1798 ms, bsdtar 2387 ms, 7-Zip 3605 ms; extract silesia.zip (lower is better): slz 0.76 s, slz -j 1 0.78 s, bsdtar 0.31 s, Python 0.61 s, 7-Zip 0.73 s, unzip 1.05 s; extract silesia.tar.gz (lower is better): slz 0.28 s, bsdtar 0.34 s, pigz | tar 0.36 s, GNU tar 0.96 s; extract silesia-nonsolid.7z (lower is better): slz 0.63 s, slz -j 1 1.50 s, 7-Zip 1.46 s, bsdtar 1.64 s; extract silesia.7z (solid) (lower is better): slz 1.50 s, slz -j 1 1.53 s, 7-Zip 1.05 s, bsdtar 1.61 s. Measured 2026-11-13 by .github/workflows/bench.yml at slz 4da826c on GitHub Actions (Ubuntu 24.04.5 LTS, image 20261111.370.1; AMD EPYC 9V45, 4 threads). Archives: whole-process wall time, best of 3 runs, warm page cache; slz runs 4 threads, slz -j 1 one. Decoders: in memory over the Silesia corpus (212 MB), best of several runs. Versions: zlib 1.4, zlib-ng 2.3.3, libdeflate 1.26, xz 5.8.4, 7-Zip 26.06, bsdtar 3.8.11, unzip 6.00, GNU tar 1.35, pigz 2.8, Python 3.12.3.</desc>
