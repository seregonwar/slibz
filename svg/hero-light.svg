<svg xmlns="http://www.w3.org/2000/svg" width="840" height="464" viewBox="0 0 840 464" role="img" aria-labelledby="title desc">
<title id="title">slz benchmarks</title>
<desc id="desc">DEFLATE decode (higher is better): slz 567 MB/s, libdeflate 927 MB/s, zlib-ng 703 MB/s, zlib 399 MB/s; LZMA2 decode (higher is better): slz 78 MB/s, xz 128 MB/s; list 500k zip entries (lower is better): slz 118 ms, unzip 670 ms, Python 2325 ms, bsdtar 2986 ms, 7-Zip 4548 ms; extract silesia.zip (lower is better): slz 0.16 s, slz -j 1 0.44 s, bsdtar 0.41 s, Python 0.84 s, 7-Zip 0.98 s, unzip 1.33 s; extract silesia.tar.gz (lower is better): slz 0.44 s, bsdtar 0.44 s, pigz | tar 0.58 s, GNU tar 1.25 s; extract silesia-nonsolid.7z (lower is better): slz 1.08 s, slz -j 1 2.94 s, 7-Zip 1.86 s, bsdtar 1.92 s; extract silesia.7z (solid) (lower is better): slz 2.93 s, slz -j 1 2.93 s, 7-Zip 1.28 s, bsdtar 1.90 s. Measured 2026-11-13 by .github/workflows/bench.yml at slz 7ddf69c on GitHub Actions (Ubuntu 24.04.5 LTS, image 20261111.370.1; AMD EPYC 7763, 4 threads). Archives: whole-process wall time, best of 3 runs, warm page cache; slz runs 4 threads, slz -j 1 one. Decoders: in memory over the Silesia corpus (212 MB), best of several runs. Versions: zlib 1.4, zlib-ng 2.3.3, libdeflate 1.26, xz 5.8.4, 7-Zip 26.06, bsdtar 3.8.11, unzip 6.00, GNU tar 1.35, pigz 2.8, Python 3.12.3.</desc>
