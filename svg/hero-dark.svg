<svg xmlns="http://www.w3.org/2000/svg" width="840" height="464" viewBox="0 0 840 464" role="img" aria-labelledby="title desc">
<title id="title">slz benchmarks</title>
<desc id="desc">DEFLATE decode (higher is better): slz 799 MB/s, libdeflate 926 MB/s, zlib-ng 701 MB/s, zlib 398 MB/s; LZMA2 decode (higher is better): slz 94 MB/s, xz 130 MB/s; list 500k zip entries (lower is better): slz 117 ms, unzip 670 ms, Python 2277 ms, bsdtar 3114 ms, 7-Zip 4683 ms; extract silesia.zip (lower is better): slz 0.12 s, slz -j 1 0.33 s, bsdtar 0.40 s, Python 0.83 s, 7-Zip 0.98 s, unzip 1.33 s; extract silesia.tar.gz (lower is better): slz 0.33 s, bsdtar 0.44 s, pigz | tar 0.58 s, GNU tar 1.24 s; extract silesia-nonsolid.7z (lower is better): slz 1.06 s, slz -j 1 2.52 s, 7-Zip 1.89 s, bsdtar 1.91 s; extract silesia.7z (solid) (lower is better): slz 2.44 s, slz -j 1 2.43 s, 7-Zip 1.24 s, bsdtar 1.86 s. Measured 2026-11-13 by .github/workflows/bench.yml at slz 6a39a2e on GitHub Actions (Ubuntu 24.04.5 LTS, image 20261111.370.1; AMD EPYC 7763, 4 threads). Archives: whole-process wall time, best of 3 runs, warm page cache; slz runs 4 threads, slz -j 1 one. Decoders: in memory over the Silesia corpus (212 MB), best of several runs. Versions: zlib 1.4, zlib-ng 2.3.3, libdeflate 1.26, xz 5.8.4, 7-Zip 26.06, bsdtar 3.8.11, unzip 6.00, GNU tar 1.35, pigz 2.8, Python 3.12.3.</desc>
