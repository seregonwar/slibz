<text x="12.5" y="22.5" font-size="13" fill="#1f2328" font-weight="600">DEFLATE decode, MB/s</text>
<text x="12.5" y="38.5" font-size="11" fill="#59636e">last 1 run on main · higher is better</text>
<line x1="44.5" y1="202.5" x2="302.5" y2="202.5" stroke="#d1d9e0" stroke-width="1"/>
