<svg xmlns="http://www.w3.org/2000/svg" width="840" height="270" viewBox="0 0 840 270" role="img" aria-labelledby="title desc">
<title id="title">slz decoder throughput over time</title>
<desc id="desc">Each point is one run on main (a push or a manual run), measured on a GitHub-hosted runner. The competitors run in the same job, so a shift shared by every line comes from the runner, not from slz.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}</style>
