# slz - Copyright (c) 2026 Seregon. SPDX-License-Identifier: MIT
#
# Continuous benchmarks, see .github/bench/. Every push builds slz and the pinned competitors from
# source on one runner and measures the in-memory decoders (DEFLATE vs zlib, zlib-ng and libdeflate;
# LZMA2 vs xz) and whole-process listing and extraction (vs unzip, bsdtar, 7-Zip, GNU tar, pigz and
# Python). The job summary shows slz's speed relative to the competitors of the same job and its
# change against the last run on main: a warning beyond the noise threshold, never a failure, since
# hosted runners are noisy. Pushes to main (and manual runs on main) also publish the result to the
# bench-data branch, which holds the README's banners and badges. Nothing else writes, and main gets
# no bot commits.
name: bench

on:
  push:
    branches-ignore: [bench-data]
    paths-ignore: ['**.md', LICENSE, .gitignore, .clang-format, .github/workflows/ci.yml]
  pull_request:
    paths-ignore: ['**.md', LICENSE, .gitignore, .clang-format, .github/workflows/ci.yml]
  workflow_dispatch:

permissions: {}

concurrency:  # every commit on main is measured and published; elsewhere a new push cancels the old run
  group: bench-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bench:
    # pull requests from this repository are measured by their push runs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore competitors
        id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/slz-bench/deps
          key: bench-deps-ubuntu-24.04-${{ hashFiles('.github/bench/deps.sh') }}
      - name: Build competitors (zlib, zlib-ng, libdeflate, xz, bsdtar, pigz, 7-Zip)
        if: steps.deps.outputs.cache-hit != 'true'
        run: bash .github/bench/deps.sh tools "$HOME/.cache/slz-bench/deps"
      - name: Save competitors
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/slz-bench/deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Restore corpus and archives
        id: data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/slz-bench/corpus/silesia.zip
            ~/.cache/slz-bench/work/*.zip
            ~/.cache/slz-bench/work/*.tar.gz
            ~/.cache/slz-bench/work/*.7z
          key: bench-data-ubuntu-24.04-${{ hashFiles('.github/bench/deps.sh', 'tests/bench.py') }}
      - name: Download the Silesia corpus
        run: bash .github/bench/deps.sh corpus "$HOME/.cache/slz-bench/corpus"

      - name: Benchmark
        run: |
          c=$HOME/.cache/slz-bench
          python3 .github/bench/run.py --deps "$c/deps" --corpus "$c/corpus" --work "$c/work" --out "$RUNNER_TEMP/bench/out"
      - name: Save corpus and archives
        if: steps.data.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/slz-bench/corpus/silesia.zip
            ~/.cache/slz-bench/work/*.zip
            ~/.cache/slz-bench/work/*.tar.gz
            ~/.cache/slz-bench/work/*.7z
          key: ${{ steps.data.outputs.cache-primary-key }}

      - name: Compare with main and render
        run: |
          out=$RUNNER_TEMP/bench/out
          if git fetch -q --depth=1 --no-tags origin +refs/heads/bench-data:refs/remotes/origin/bench-data; then
            git show origin/bench-data:history.json > "$RUNNER_TEMP/history.json" || rm -f "$RUNNER_TEMP/history.json"
          else
            echo "No bench-data branch yet: nothing to compare with."
          fi
          python3 .github/bench/report.py stage "$out/result.json" --out "$out" --history "$RUNNER_TEMP/history.json"
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
          # the publishing path without the push: the artifact gets the banners of this run
          bash .github/bench/publish.sh "$out/result.json" "$RUNNER_TEMP/bench/site" --dry-run

      - name: Upload results and banners
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ github.sha }}
          path: |
            ${{ runner.temp }}/bench/out
            ${{ runner.temp }}/bench/site
          retention-days: 30
          overwrite: true
          if-no-files-found: warn

  publish:
    needs: bench
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push to bench-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-${{ github.sha }}
          path: ${{ runner.temp }}/bench
      - name: Publish to bench-data
        run: bash .github/bench/publish.sh "$RUNNER_TEMP/bench/out/result.json" "$RUNNER_TEMP/site"
