# inflate-faster-bench only (never merged): CI A/B inflate benchmark and differential fuzz of the
# variants in bench/variants.txt against libdeflate, zlib-ng and zlib, see bench/ci.sh.
name: abbench
on:
  push:
    branches: [inflate-faster-bench]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ab:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86-gcc, os: ubuntu-latest, cc: gcc }
          - { name: x86-gcc-2, os: ubuntu-latest, cc: gcc, fuzz: 0 }
          - { name: x86-gcc-3, os: ubuntu-latest, cc: gcc, fuzz: 0 }
          - { name: x86-gcc-4, os: ubuntu-latest, cc: gcc, fuzz: 0 }
          - { name: x86-gcc-5, os: ubuntu-latest, cc: gcc, fuzz: 0 }
          - { name: x86-gcc-6, os: ubuntu-latest, cc: gcc, fuzz: 0 }
          - { name: x86-clang, os: ubuntu-latest, cc: clang }
          - { name: arm64, os: ubuntu-24.04-arm, cc: gcc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A/B bench and fuzz
        run: bash bench/ci.sh ${{ matrix.cc }} ${{ matrix.fuzz }}