name: ci
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:  # a new push cancels the older run of the same branch or PR; every commit on main runs to the end
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc, name: linux-gcc-asan }
          - { os: ubuntu-latest, cc: clang, name: linux-clang-asan }
          - { os: ubuntu-24.04-arm, cc: gcc, name: linux-arm64-asan }
          - { os: macos-latest, cc: clang, name: macos-arm64-asan }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -qq && sudo apt-get install -y -qq 7zip zlib1g-dev liblzma-dev; fi
          if [ "$RUNNER_OS" = macOS ]; then HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install sevenzip xz; fi
      - name: build (ASan + UBSan + fault injection)
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DSLZ_SANITIZE=ON -DSLZ_FAULT_INJECTION=ON
          cmake --build build -j4
      - name: tests (round trips, hostile archives, fuzz, kills, injected I/O faults, resume)
        run: ctest --test-dir build --output-on-failure -j 8
      - name: archive fuzzer (short run over small seeds of every format)
        run: |
          cmake --build build --target fuzz_archive # sanitizer flags from the slz target
          python3 - <<'EOF'
          import os, random, sys
          sys.argv, src = ["run_tests.py", "-", "-"], "seeds-src"
          sys.path.insert(0, "tests")
          import run_tests
          rnd = random.Random(7)
          files = {"text/lorem.txt": b"lorem ipsum dolor sit amet " * 400, "e.txt": b"", "z.bin": bytes(70000),
                   "r/r.bin": rnd.randbytes(5000), "r/m.bin": rnd.randbytes(64) * 300}
          for name, data in files.items():
              os.makedirs(os.path.dirname(os.path.join(src, name)), exist_ok=True)
              open(os.path.join(src, name), "wb").write(data)
          os.makedirs("seeds")
          print("seeds:", *sorted(run_tests.pack_all(src, os.path.abspath("seeds"))))
          EOF
          build/slz a seeds/tree.slz seeds-src/* -q
          build/fuzz_archive fzwork 400 1 seeds/*
      - name: release build + install
        run: |
          cmake -S . -B rel -DCMAKE_C_COMPILER=${{ matrix.cc }} -DSLZ_TESTS=OFF
          cmake --build rel -j4 && cmake --install rel --prefix "$PWD/inst"

  # Each Windows job is split across 3 runners: the destructive and fault tests flush to disk at every
  # step, and one runner's disk was the bottleneck. `ctest -I k,,3` runs every third test, so together
  # the shards run every test (the shared fixture comes with each); the job with the original name
  # (a required check) passes only when all of its shards pass.
  windows-msvc-shards:
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3] }
    name: windows-msvc (${{ matrix.shard }}/3)
    runs-on: windows-latest
    env: { TOOLSET: "" } # no fixed -G: CMake picks the newest Visual Studio installed on the runner
    steps: &windows-steps
      - uses: actions/checkout@v4
      - name: build (fault injection)
        run: |
          cmake -S . -B build -A x64 ${{ env.TOOLSET }} -DSLZ_FAULT_INJECTION=ON
          cmake --build build --config Release
      - name: tests
        env: { TEMP: "${{ runner.temp }}", TMP: "${{ runner.temp }}" } # the workspace drive
        run: ctest --test-dir build -C Release --output-on-failure -j 8 -I "${{ matrix.shard }},,3"

  windows-clang-cl-shards:
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3] }
    name: windows-clang-cl (${{ matrix.shard }}/3)
    runs-on: windows-latest
    env: { TOOLSET: "-T ClangCL" }
    steps: *windows-steps

  windows-msvc:
    needs: windows-msvc-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.windows-msvc-shards.result }}" = success

  windows-clang-cl:
    needs: windows-clang-cl-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.windows-clang-cl-shards.result }}" = success

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          cpu: 4
          copyback: false
          cache-after-prepare: true  # the VM image with the packages below is cached: no pkg install per run
          prepare: pkg install -y cmake python3 7-zip
          run: |
            cmake -S . -B build -DSLZ_FAULT_INJECTION=ON
            cmake --build build -j4
            ctest --test-dir build --output-on-failure -j 8

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: wasi-sdk
        env: { GH_TOKEN: "${{ github.token }}" }  # authenticated: the anonymous API rate limit is shared per runner IP
        run: |
          gh release download --repo WebAssembly/wasi-sdk --pattern '*x86_64-linux.tar.gz' --output wasi.tar.gz
          mkdir -p wasi && tar -xzf wasi.tar.gz -C wasi --strip-components=1
      - name: build and run under WASI
        run: |
          wasi/bin/clang --target=wasm32-wasip1 -O2 -Wall -Wextra -Iinclude -Isrc src/*.c tools/slz.c -o slz.wasm
          mkdir -p w && cd w && printf 'hello wasm\n' > a.txt && mkdir d && cp a.txt d/b.txt && zip -q -r t.zip a.txt d && cd ..
          cat > run.mjs <<'EOF'
          import { readFile } from 'node:fs/promises'; import { WASI } from 'node:wasi';
          const [,, wasm, dir, ...args] = process.argv;
          const wasi = new WASI({ version: 'preview1', args: ['slz', ...args], preopens: { '/w': dir }, returnOnExit: true });
          const inst = await WebAssembly.instantiate(await WebAssembly.compile(await readFile(wasm)), wasi.getImportObject());
          process.exitCode = wasi.start(inst);
          EOF
          node --no-warnings run.mjs slz.wasm "$PWD/w" x /w/t.zip /w/out
          cmp w/a.txt w/out/a.txt && cmp w/d/b.txt w/out/d/b.txt
